          - code [ref=e30]: brew install statico/tap/macotron
        - paragraph [ref=e31]: Free and open source. Built with Swift and QuickJS.
      - figure "Save the file. The hotkey is live." [ref=e32]:
        - code [ref=e34]: "// ~/Macotron/plugins/tile.js macotron.keyboard.on(\"Tile Left\", \"ctrl+opt+left\", () => { const win = macotron.window.focused(); macotron.window.moveToFraction(win.id, { x: 0, y: 0, w: 0.5, h: 1, }); });"
