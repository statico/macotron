name: Bug report
description: Something in Macotron does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Macotron version
      description: Settings → General, at the bottom.
      placeholder: "0.2.3"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "`sw_vers -productVersion`"
      placeholder: "26.0"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Macotron logs through the unified log, so nothing is written to a file
        until you ask for it. Run this in Terminal, reproduce the problem, then
        press Ctrl-C and paste what it printed:

        ```sh
        log stream --level info --style compact \
          --predicate 'subsystem == "io.statico.macotron"' | tee /tmp/macotron.log
        ```

        The log ends up in `/tmp/macotron.log` as well, so you can attach it.
        From a clone of the repo, `make trace` runs the same command and tees
        to `tmp/log`.

        The log contains window and app names, plugin filenames, and URLs your
        plugins open. Read it before pasting.
      render: text
    validations:
      required: false

  - type: textarea
    id: plugin
    attributes:
      label: Plugin
      description: If a plugin is involved, paste it or link it.
      render: javascript
    validations:
      required: false
