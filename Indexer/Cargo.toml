[package]
name = "macotron-index"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "macotron-index"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ignore = "0.4.23"
notify = "8.0.0"
libc = "0.2.189"
memchr = "2.8.3"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
lto = true
codegen-units = 1
